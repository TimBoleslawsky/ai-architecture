services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
      POSTGRES_DB: pm
    ports:
      - "5432:5432"
    volumes:
      - pm_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      timeout: 3s
      retries: 10

  serve:
    build: ..
    environment:
      DATABASE_URL: postgresql://pm:pm@db:5432/pm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "src.serving.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: ..
    environment:
      DATABASE_URL: postgresql://pm:pm@db:5432/pm
      SCORE_INTERVAL_S: "30"
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "src.serving.batch_scorer"]

volumes:
  pm_pgdata:
