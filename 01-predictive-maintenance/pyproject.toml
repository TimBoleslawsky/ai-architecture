[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "AI & Data Analytics showcase: predictive maintenance on industrial equipment (RUL prediction)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "onnxruntime>=1.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "torch>=2.3",
    "lightning>=2.5",
    "omegaconf>=2.3",
    "onnxscript>=0.1",
]

[tool.uv]
package = false
