[project]
name = "llm-invoice-automation"
version = "0.1.0"
description = "AI for Automation showcase: a small open-source LLM processes supplier invoices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pdfminer.six>=20240706",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
